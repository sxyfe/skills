<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">xhs-interview-cards</title>
  <desc id="desc">Turn a real public interview into verifiable quote notes and caption-strip images. The right side is a product sketch, not a real portrait.</desc>
  <rect width="1200" height="390" rx="26" fill="#111111"/>
  <g id="title-block" transform="translate(56 52)">
    <text x="0" y="18" fill="#8A847C" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2.2">SKILL · XHS-INTERVIEW-CARDS</text>
    <text x="0" y="86" fill="#F6F1E8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="52" font-weight="700">人物访谈截图</text>
    <text x="0" y="136" fill="#E8D5A3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22">真实访谈做成金句笔记</text>
    <text x="0" y="168" fill="#E8D5A3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22">再切成 5-8 张花卷字幕条</text>
    <g transform="translate(0 214)">
      <rect x="0" y="0" width="128" height="32" rx="16" fill="#1C1C1C" stroke="#3A3732"/>
      <text x="64" y="21" text-anchor="middle" fill="#F6F1E8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">1080x1440</text>
      <rect x="140" y="0" width="118" height="32" rx="16" fill="#1C1C1C" stroke="#3A3732"/>
      <text x="199" y="21" text-anchor="middle" fill="#F6F1E8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">5-8 张</text>
      <rect x="270" y="0" width="148" height="32" rx="16" fill="#1C1C1C" stroke="#3A3732"/>
      <text x="344" y="21" text-anchor="middle" fill="#F6F1E8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">不自动发布</text>
    </g>
  </g>
  <g id="project-proof" transform="translate(640 36)">
    <g transform="rotate(-6 160 160)">
      <rect x="18" y="18" width="236" height="314" rx="18" fill="#1A1916"/>
      <rect x="30" y="30" width="212" height="118" rx="10" fill="#2A2722"/>
      <rect x="86" y="58" width="44" height="44" rx="22" fill="#3E3A33"/>
      <rect x="118" y="70" width="38" height="38" rx="19" fill="#524C42"/>
      <rect x="30" y="160" width="212" height="28" rx="6" fill="#E8D5A3"/>
      <rect x="30" y="198" width="176" height="10" rx="5" fill="#6B6560"/>
      <rect x="30" y="218" width="148" height="10" rx="5" fill="#6B6560"/>
      <rect x="30" y="238" width="164" height="10" rx="5" fill="#6B6560"/>
    </g>
    <g transform="rotate(4 280 170)">
      <rect x="148" y="8" width="268" height="338" rx="20" fill="#F6F1E8"/>
      <rect x="162" y="22" width="240" height="132" rx="12" fill="#171717"/>
      <circle cx="258" cy="82" r="26" fill="#2C2C2C"/>
      <circle cx="292" cy="94" r="22" fill="#3A3A3A"/>
      <rect x="186" y="118" width="88" height="8" rx="4" fill="#5A554E"/>
      <rect x="162" y="166" width="240" height="158" rx="12" fill="#111111"/>
      <text x="282" y="198" text-anchor="middle" fill="#E8D5A3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="15" font-weight="600">管理者的起点</text>
      <text x="282" y="228" text-anchor="middle" fill="#F6F1E8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="16">不是答案</text>
      <text x="282" y="256" text-anchor="middle" fill="#F6F1E8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="16">而是好奇心</text>
      <text x="282" y="284" text-anchor="middle" fill="#C9C2B6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="14">一帧切成一条字幕</text>
    </g>
  </g>
</svg>
