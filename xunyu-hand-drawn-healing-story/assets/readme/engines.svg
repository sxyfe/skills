<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
 <title id="title">四种成片方式场景地图</title>
 <desc id="desc">video-use 默认日更；HTML 预览；Remotion 高画质；Hyperframes 工作室精修。</desc>
 <rect width="1200" height="420" rx="26" fill="#F7F4EE"/>
 <text x="56" y="52" fill="#1A1A1A" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="24" font-weight="700">四引擎 · 同一套手绘规格，不同交付场景</text>
 <text x="56" y="82" fill="#8A857C" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="15">实测同素材 · 1080×1920 @30fps · ~53s 静音</text>
 <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
 <g transform="translate(48 112)">
 <rect width="260" height="260" rx="18" fill="#1A1A1A"/>
 <text x="24" y="42" fill="#C4A574" font-size="13" letter-spacing="1">DEFAULT</text>
 <text x="24" y="78" fill="#F7F4EE" font-size="22" font-weight="700">video-use</text>
 <text x="24" y="112" fill="#D0CBC2" font-size="14">日更 / 批量 / Agent</text>
 <text x="24" y="148" fill="#F7F4EE" font-size="15">~8.5 MB · 1.3 Mbps</text>
 <text x="24" y="178" fill="#A8A29A" font-size="13">稳 · 小体积 · Smoke</text>
 <text x="24" y="230" fill="#C4A574" font-size="14">适合：视频号 / 抖音发布</text>
 </g>
 <g transform="translate(328 112)">
 <rect width="260" height="260" rx="18" fill="#FFFEFA" stroke="#D0C8BA"/>
 <text x="24" y="42" fill="#8A857C" font-size="13" letter-spacing="1">PREVIEW</text>
 <text x="24" y="78" fill="#1A1A1A" font-size="22" font-weight="700">HTML/CSS/JS</text>
 <text x="24" y="112" fill="#4A4740" font-size="14">调参 / 客户试看</text>
 <text x="24" y="148" fill="#1A1A1A" font-size="15">浏览器即时预览</text>
 <text x="24" y="178" fill="#8A857C" font-size="13">手感锚点 · 不成片</text>
 <text x="24" y="230" fill="#C4A574" font-size="14">适合：定规格后再导出</text>
 </g>
 <g transform="translate(608 112)">
 <rect width="260" height="260" rx="18" fill="#FFFEFA" stroke="#D0C8BA"/>
 <text x="24" y="42" fill="#8A857C" font-size="13" letter-spacing="1">QUALITY</text>
 <text x="24" y="78" fill="#1A1A1A" font-size="22" font-weight="700">Remotion</text>
 <text x="24" y="112" fill="#4A4740" font-size="14">CI / 程序化母带</text>
 <text x="24" y="148" fill="#1A1A1A" font-size="15">~52 MB · 7.9 Mbps</text>
 <text x="24" y="178" fill="#8A857C" font-size="13">帧精确 · 冷启动重</text>
 <text x="24" y="230" fill="#C4A574" font-size="14">适合：先厚再压片</text>
 </g>
 <g transform="translate(888 112)">
 <rect width="260" height="260" rx="18" fill="#FFFEFA" stroke="#D0C8BA"/>
 <text x="24" y="42" fill="#8A857C" font-size="13" letter-spacing="1">STUDIO</text>
 <text x="24" y="78" fill="#1A1A1A" font-size="22" font-weight="700">Hyperframes</text>
 <text x="24" y="112" fill="#4A4740" font-size="14">时间轴精修</text>
 <text x="24" y="148" fill="#1A1A1A" font-size="15">~27 MB · 4.2 Mbps</text>
 <text x="24" y="178" fill="#8A857C" font-size="13">Studio 强 · 契约严</text>
 <text x="24" y="230" fill="#C4A574" font-size="14">适合：偶发精品集</text>
 </g>
 </g>
</svg>
