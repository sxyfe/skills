<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-labelledby="title desc">
 <title id="title">从自然语言到成片</title>
 <desc id="desc">一句话 → 选题分镜 → Smoke 或 Full → 四引擎择一出片。</desc>
 <rect width="1200" height="200" rx="22" fill="#F7F4EE"/>
 <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="15">
 <g transform="translate(40 48)">
 <rect width="200" height="104" rx="14" fill="#FFFEFA" stroke="#D0C8BA"/>
 <text x="100" y="42" text-anchor="middle" fill="#8A857C" font-size="12">01</text>
 <text x="100" y="70" text-anchor="middle" fill="#1A1A1A" font-weight="600">一句话</text>
 <text x="100" y="94" text-anchor="middle" fill="#8A857C" font-size="13">最多问 1 次</text>
 </g>
 <path d="M252 100 L288 100" stroke="#C4A574" stroke-width="2.5"/>
 <g transform="translate(300 48)">
 <rect width="200" height="104" rx="14" fill="#FFFEFA" stroke="#D0C8BA"/>
 <text x="100" y="42" text-anchor="middle" fill="#8A857C" font-size="12">02</text>
 <text x="100" y="70" text-anchor="middle" fill="#1A1A1A" font-weight="600">主题 + 分镜</text>
 <text x="100" y="94" text-anchor="middle" fill="#8A857C" font-size="13">10 池 / 默认 02</text>
 </g>
 <path d="M512 100 L548 100" stroke="#C4A574" stroke-width="2.5"/>
 <g transform="translate(560 48)">
 <rect width="200" height="104" rx="14" fill="#FFFEFA" stroke="#D0C8BA"/>
 <text x="100" y="42" text-anchor="middle" fill="#8A857C" font-size="12">03</text>
 <text x="100" y="70" text-anchor="middle" fill="#1A1A1A" font-weight="600">Smoke / Full</text>
 <text x="100" y="94" text-anchor="middle" fill="#8A857C" font-size="13">占位测通 / 真生图</text>
 </g>
 <path d="M772 100 L808 100" stroke="#C4A574" stroke-width="2.5"/>
 <g transform="translate(820 48)">
 <rect width="320" height="104" rx="14" fill="#1A1A1A"/>
 <text x="160" y="42" text-anchor="middle" fill="#C4A574" font-size="12">04</text>
 <text x="160" y="70" text-anchor="middle" fill="#F7F4EE" font-weight="600">引擎出片</text>
 <text x="160" y="94" text-anchor="middle" fill="#A8A29A" font-size="13">默认 video-use → 可发平台</text>
 </g>
 </g>
</svg>
