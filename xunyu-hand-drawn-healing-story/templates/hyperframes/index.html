<!doctype html>
<html lang="zh-CN">
 <head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=1080, height=1920" />
 <title>手绘视频 · HyperFrames 模板</title>
 <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
 <style>
 @font-face {
 font-family: "CaptionSerif";
 src: local("Songti SC"), local("STSong"), local("Kaiti SC"), local("STKaiti");
 }
 body { margin: 0; background: #111; color: #222; font-family: "CaptionSerif", serif; }
 #root {
 position: relative; width: 1080px; height: 1920px;
 overflow: hidden; background: #fff;
 }
 .clip { position: absolute; inset: 0; overflow: hidden; }
 .fill { position: absolute; inset: 0; background: #fff; }
 .stack {
 position: absolute; inset: 0; transform-origin: center 55%;
 clip-path: inset(0 100% 0 0);
 }
 .stack img {
 position: absolute; inset: 0; width: 100%; height: 100%;
 object-fit: cover; display: block;
 }
 .stack .color { opacity: 0; }
 .caption {
 position: absolute; top: 6.5%; left: 7%; right: 7%; z-index: 5;
 font-size: 42px; line-height: 1.55; text-align: center;
 letter-spacing: 0.04em; color: #222; opacity: 0;
 white-space: pre-line;
 text-shadow: 0 0 12px #fff, 0 0 4px #fff;
 }
 .end-fade {
 position: absolute; inset: 0; background: #fff;
 opacity: 0; z-index: 8; pointer-events: none;
 }
 </style>
 </head>
 <body>
 <!-- 根节点必须 data-start="0"；按分镜改 duration / 增删 section -->
 <div
 id="root"
 data-composition-id="episode"
 data-width="1080"
 data-height="1920"
 data-duration="15"
 data-start="0"
 >
 <section id="shot-1" class="clip" data-start="0" data-duration="5" data-track-index="1">
 <div class="fill"></div>
 <div class="stack" id="s1">
 <img class="bw" src="assets/01-bw.png" alt="" />
 <img class="color" src="assets/01-color.png" alt="" />
 </div>
 <div class="caption" id="c1">第一句旁白。</div>
 </section>
 <section id="shot-2" class="clip" data-start="5" data-duration="5" data-track-index="1">
 <div class="fill"></div>
 <div class="stack" id="s2">
 <img class="bw" src="assets/02-bw.png" alt="" />
 <img class="color" src="assets/02-color.png" alt="" />
 </div>
 <div class="caption" id="c2">第二句旁白。</div>
 </section>
 <section id="shot-3" class="clip" data-start="10" data-duration="5" data-track-index="1">
 <div class="fill"></div>
 <div class="stack" id="s3">
 <img class="bw" src="assets/03-bw.png" alt="" />
 <img class="color" src="assets/03-color.png" alt="" />
 </div>
 <div class="caption" id="c3">第三句旁白。
可两行。</div>
 <div class="end-fade" id="endFade"></div>
 </section>
 </div>

 <script>
 window.__timelines = window.__timelines || {};
 const tl = gsap.timeline({ paused: true });
 const shots = [
 { id: 1, start: 0, dur: 5 },
 { id: 2, start: 5, dur: 5 },
 { id: 3, start: 10, dur: 5 },
 ];
 shots.forEach((s) => {
 const stack = `#s${s.id}`;
 const color = `#s${s.id} .color`;
 const cap = `#c${s.id}`;
 tl.fromTo(
 stack,
 { clipPath: "inset(0 100% 0 0)", scale: 1 },
 { clipPath: "inset(0 0% 0 0)", duration: 1.0, ease: "power3.out" },
 s.start
 );
 tl.to(color, { opacity: 1, duration: 0.8, ease: "power2.out" }, s.start + 0.85);
 tl.fromTo(cap, { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, s.start + 0.15);
 tl.to(stack, { scale: 1.04, duration: s.dur, ease: "none" }, s.start);
 });
 tl.to("#endFade", { opacity: 1, duration: 0.4, ease: "power1.in" }, 14.6);
 window.__timelines["episode"] = tl;
 </script>
 </body>
</html>
